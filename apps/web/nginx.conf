server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    return 301 /;
  }

  # Public HTML contains useful content even before JavaScript runs.
  location = / {
    try_files /index.html =404;
  }

  location = /app.html {
    internal;
  }

  # Missing static assets must not return a successful SPA HTML response.
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js|mjs|woff2?|txt|xml)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /app.html;
  }
}
