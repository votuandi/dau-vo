server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

  location = /index.html {
    return 301 /;
  }

  # Public HTML contains useful content even before JavaScript runs. HTML is
  # revalidated on every visit so a deploy is picked up immediately.
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /app.html {
    internal;
    add_header Cache-Control "no-cache";
  }

  # Vite fingerprints every file under /assets/, so it can be cached forever.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Missing static assets must not return a successful SPA HTML response.
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js|mjs|woff2?|txt|xml)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /app.html;
  }
}
