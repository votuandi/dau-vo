name: martial-arts-scoring-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-martial_arts_scoring}
      POSTGRES_USER: ${POSTGRES_USER:-martial_arts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-martial_arts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-martial_arts_scoring}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the public HTTPS origin in .env.production}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set a 32+ character secret}
      MATCH_SESSION_SECRET: ${MATCH_SESSION_SECRET:?Set a 32+ character secret}
      ROUND_DURATION_MS: ${ROUND_DURATION_MS:-120000}
      BREAK_DURATION_MS: ${BREAK_DURATION_MS:-60000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:8080']
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }

volumes:
  postgres_data:
  redis_data:
