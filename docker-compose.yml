name: martial-arts-scoring

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-martial_arts_scoring}
      POSTGRES_USER: ${POSTGRES_USER:-martial_arts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose environment}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-martial_arts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-martial_arts_scoring}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the public HTTPS origin in the Compose environment}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set a 32+ character secret}
      BRACKET_PREVIEW_SECRET: ${BRACKET_PREVIEW_SECRET:?Set a 32+ character secret}
      MATCH_SESSION_SECRET: ${MATCH_SESSION_SECRET:?Set a 32+ character secret}
      OFFICIAL_PASSCODE_SECRET: ${OFFICIAL_PASSCODE_SECRET:?Set a 32+ character secret}
      OFFICIAL_SESSION_SECRET: ${OFFICIAL_SESSION_SECRET:?Set a 32+ character secret}
      INITIAL_SUPER_ADMIN_PASSWORD: ${INITIAL_SUPER_ADMIN_PASSWORD:?Set a non-default initial super-admin password}
      ROUND_DURATION_MS: ${ROUND_DURATION_MS:-120000}
      BREAK_DURATION_MS: ${BREAK_DURATION_MS:-60000}
      IMAGE_STORAGE_DRIVER: ${IMAGE_STORAGE_DRIVER:-local}
      IMAGE_UPLOAD_ROOT: ${IMAGE_UPLOAD_ROOT:-/workspace/apps/api/public/uploads}
      # Optional in local mode; validated as non-empty by the API only for s3.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [api_uploads:/workspace/apps/api/public/uploads]

  # Explicit one-shot production bootstrap. It is profile-gated so normal API
  # restarts never run the seed or change the Super Admin password.
  bootstrap:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['bootstrap']
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-martial_arts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-martial_arts_scoring}?schema=public
      INITIAL_SUPER_ADMIN_PASSWORD: ${INITIAL_SUPER_ADMIN_PASSWORD:?Set a non-default initial super-admin password}
    depends_on:
      postgres: { condition: service_healthy }
    command:
      [
        'sh',
        '-ec',
        'pnpm --filter @martial-arts-scoring/api prisma:migrate:deploy && pnpm --filter @martial-arts-scoring/api prisma:seed && pnpm --filter @martial-arts-scoring/api prisma:verify:super-admin',
      ]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:8080']
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }

volumes:
  postgres_data:
  redis_data:
  api_uploads:
