name: dau-vo

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dau_vo}
      POSTGRES_USER: ${POSTGRES_USER:-dau_vo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-postgres-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [data]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [data]

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate
    restart: "no"
    environment: &api-environment
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dau_vo}:${POSTGRES_PASSWORD:-local-only-postgres-password}@postgres:5432/${POSTGRES_DB:-dau_vo}?schema=public
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-local-only-admin-session-secret-change-me}
      MATCH_SESSION_SECRET: ${MATCH_SESSION_SECRET:-local-only-match-session-secret-change-me}
      ACCESS_CODE_ENCRYPTION_KEY: ${ACCESS_CODE_ENCRYPTION_KEY:-local-only-access-code-key-change-me}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      MATCH_SESSION_TTL_SECONDS: ${MATCH_SESSION_TTL_SECONDS:-28800}
      ROUND_DURATION_MS: ${ROUND_DURATION_MS:-120000}
      BREAK_DURATION_MS: ${BREAK_DURATION_MS:-60000}
      SCORING_WINDOW_DURATION_MS: ${SCORING_WINDOW_DURATION_MS:-1000}
      MATCH_PUBLIC_ID_INITIAL_LENGTH: ${MATCH_PUBLIC_ID_INITIAL_LENGTH:-6}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-admin}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-local-development-only}
      DEV_TOURNAMENT_NAME: ${DEV_TOURNAMENT_NAME:-National Martial Arts Championship}
      DEV_MATCH_PUBLIC_ID: ${DEV_MATCH_PUBLIC_ID:-A72K9P}
      DEV_REFEREE_1_CODE: ${DEV_REFEREE_1_CODE:-374952}
      DEV_REFEREE_2_CODE: ${DEV_REFEREE_2_CODE:-610284}
      DEV_REFEREE_3_CODE: ${DEV_REFEREE_3_CODE:-915743}
      DEV_INSPECTOR_CODE: ${DEV_INSPECTOR_CODE:-538194}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    networks: [app, data]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    restart: unless-stopped
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [app]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    networks: [app]

volumes:
  postgres-data:
  redis-data:

networks:
  app:
  data:
    internal: true

